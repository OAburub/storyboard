<svg width="100%" height="100%" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" style="background-color: #F8F9FA;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#EEF2F7" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D588C" />
      <stop offset="100%" stop-color="#4A90D9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2D588C" flood-opacity="0.15" />
    </filter>

    <!-- Subtle Icon/Pattern Clip Paths -->
    <clipPath id="clip1">
      <rect x="960" y="310" width="230" height="200" rx="16" />
    </clipPath>
    <clipPath id="clip2">
      <rect x="670" y="310" width="230" height="200" rx="16" />
    </clipPath>
    <clipPath id="clip3">
      <rect x="380" y="310" width="230" height="200" rx="16" />
    </clipPath>
    <clipPath id="clip4">
      <rect x="90" y="310" width="230" height="200" rx="16" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)" />

  <!-- Decorative Background Geometric Elements -->
  <circle cx="100" cy="650" r="300" fill="#4A90D9" opacity="0.03" />
  <circle cx="1200" cy="-50" r="250" fill="#2D588C" opacity="0.04" />

  <!-- Title Section -->
  <text x="640" y="120" font-family="Tajawal, sans-serif" font-size="28" font-weight="bold" fill="#2D588C" text-anchor="middle" direction="rtl">مراحل التصميم التعليمي</text>
  <line x1="600" y1="145" x2="680" y2="145" stroke="#F5A623" stroke-width="4" stroke-linecap="round" />

  <!-- Connecting Arrows (Right to Left) -->
  <g id="arrows">
    <!-- Arrow 1 (Card 1 to Card 2) -->
    <path d="M 960 410 Q 935 440 910 410" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
    <polyline points="920,400 905,410 920,420" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrow 2 (Card 2 to Card 3) -->
    <path d="M 670 410 Q 645 440 620 410" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
    <polyline points="630,400 615,410 630,420" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrow 3 (Card 3 to Card 4) -->
    <path d="M 380 410 Q 355 440 330 410" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
    <polyline points="340,400 325,410 340,420" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Step 1: التحليل -->
  <g id="step1">
    <rect x="960" y="310" width="230" height="200" rx="16" fill="url(#cardGradient)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="1140" cy="350" r="120" fill="#FFFFFF" opacity="0.05" clip-path="url(#clip1)" />
    
    <text x="1075" y="380" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" direction="rtl">التحليل</text>
    <line x1="1050" y1="410" x2="1100" y2="410" stroke="#F5A623" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    
    <text x="1075" y="455" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">تحديد الاحتياجات</text>
    <text x="1075" y="485" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">والأهداف</text>

    <!-- Step Number Circle -->
    <circle cx="1075" cy="290" r="40" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="1075" cy="290" r="34" fill="#FFFFFF" stroke="#F5A623" stroke-width="2" />
    <text x="1075" y="300" font-family="Tajawal, sans-serif" font-size="26" font-weight="bold" fill="#2D588C" text-anchor="middle">1</text>
  </g>

  <!-- Step 2: التصميم -->
  <g id="step2">
    <rect x="670" y="310" width="230" height="200" rx="16" fill="url(#cardGradient)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="850" cy="350" r="120" fill="#FFFFFF" opacity="0.05" clip-path="url(#clip2)" />
    
    <text x="785" y="380" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" direction="rtl">التصميم</text>
    <line x1="760" y1="410" x2="810" y2="410" stroke="#F5A623" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    
    <text x="785" y="455" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">تصميم المحتوى</text>
    <text x="785" y="485" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">والأنشطة</text>

    <!-- Step Number Circle -->
    <circle cx="785" cy="290" r="40" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="785" cy="290" r="34" fill="#FFFFFF" stroke="#F5A623" stroke-width="2" />
    <text x="785" y="300" font-family="Tajawal, sans-serif" font-size="26" font-weight="bold" fill="#2D588C" text-anchor="middle">2</text>
  </g>

  <!-- Step 3: التطوير -->
  <g id="step3">
    <rect x="380" y="310" width="230" height="200" rx="16" fill="url(#cardGradient)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="560" cy="350" r="120" fill="#FFFFFF" opacity="0.05" clip-path="url(#clip3)" />
    
    <text x="495" y="380" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" direction="rtl">التطوير</text>
    <line x1="470" y1="410" x2="520" y2="410" stroke="#F5A623" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    
    <text x="495" y="455" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">إنتاج المواد</text>
    <text x="495" y="485" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">التعليمية</text>

    <!-- Step Number Circle -->
    <circle cx="495" cy="290" r="40" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="495" cy="290" r="34" fill="#FFFFFF" stroke="#F5A623" stroke-width="2" />
    <text x="495" y="300" font-family="Tajawal, sans-serif" font-size="26" font-weight="bold" fill="#2D588C" text-anchor="middle">3</text>
  </g>

  <!-- Step 4: التقييم -->
  <g id="step4">
    <rect x="90" y="310" width="230" height="200" rx="16" fill="url(#cardGradient)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="270" cy="350" r="120" fill="#FFFFFF" opacity="0.05" clip-path="url(#clip4)" />
    
    <text x="205" y="380" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" direction="rtl">التقييم</text>
    <line x1="180" y1="410" x2="230" y2="410" stroke="#F5A623" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    
    <text x="205" y="455" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">قياس فعالية</text>
    <text x="205" y="485" font-family="Tajawal, sans-serif" font-size="16" fill="#E8F1F9" text-anchor="middle" direction="rtl">التعلم</text>

    <!-- Step Number Circle -->
    <circle cx="205" cy="290" r="40" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="205" cy="290" r="34" fill="#FFFFFF" stroke="#F5A623" stroke-width="2" />
    <text x="205" y="300" font-family="Tajawal, sans-serif" font-size="26" font-weight="bold" fill="#2D588C" text-anchor="middle">4</text>
  </g>

</svg>