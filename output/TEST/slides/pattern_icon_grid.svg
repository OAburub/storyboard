<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&amp;display=swap');
    </style>
    
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Card Clip Path for Accent Bar -->
    <clipPath id="cardClip">
      <rect width="280" height="160" rx="15"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Title Section -->
  <text x="640" y="110" font-family="'Tajawal', sans-serif" font-size="42" font-weight="800" fill="#2D588C" text-anchor="middle" direction="rtl">مهارات القرن الحادي والعشرين</text>
  <rect x="580" y="135" width="120" height="4" rx="2" fill="#F5A623" />

  <!-- Grid Items -->
  
  <!-- Row 1, Column 3 (Item 1: Right) -->
  <g transform="translate(840, 230)">
    <rect width="280" height="160" rx="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g clip-path="url(#cardClip)">
      <rect width="280" height="6" fill="#2D588C"/>
    </g>
    <!-- Icon: Circle -->
    <g transform="translate(140, 55)">
      <circle cx="0" cy="0" r="22" fill="#2D588C" opacity="0.1"/>
      <circle cx="0" cy="0" r="12" fill="#2D588C"/>
    </g>
    <!-- Text -->
    <text x="140" y="105" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle" direction="rtl">التفكير النقدي</text>
    <text x="140" y="130" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">تحليل وتقييم المعلومات</text>
  </g>

  <!-- Row 1, Column 2 (Item 2: Middle) -->
  <g transform="translate(500, 230)">
    <rect width="280" height="160" rx="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g clip-path="url(#cardClip)">
      <rect width="280" height="6" fill="#F5A623"/>
    </g>
    <!-- Icon: Hexagon -->
    <g transform="translate(140, 55)">
      <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12" fill="#F5A623" opacity="0.1"/>
      <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#F5A623"/>
    </g>
    <!-- Text -->
    <text x="140" y="105" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle" direction="rtl">الإبداع</text>
    <text x="140" y="130" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">إنتاج أفكار جديدة</text>
  </g>

  <!-- Row 1, Column 1 (Item 3: Left) -->
  <g transform="translate(160, 230)">
    <rect width="280" height="160" rx="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g clip-path="url(#cardClip)">
      <rect width="280" height="6" fill="#009688"/>
    </g>
    <!-- Icon: Diamond -->
    <g transform="translate(140, 55)">
      <polygon points="0,-26 26,0 0,26 -26,0" fill="#009688" opacity="0.1"/>
      <polygon points="0,-13 13,0 0,13 -13,0" fill="#009688"/>
    </g>
    <!-- Text -->
    <text x="140" y="105" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle" direction="rtl">التعاون</text>
    <text x="140" y="130" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">العمل ضمن فريق</text>
  </g>

  <!-- Row 2, Column 3 (Item 4: Right) -->
  <g transform="translate(840, 440)">
    <rect width="280" height="160" rx="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g clip-path="url(#cardClip)">
      <rect width="280" height="6" fill="#FF9800"/>
    </g>
    <!-- Icon: Triangle -->
    <g transform="translate(140, 55)">
      <polygon points="0,-24 24,18 -24,18" fill="#FF9800" opacity="0.1"/>
      <polygon points="0,-12 12,9 -12,9" fill="#FF9800"/>
    </g>
    <!-- Text -->
    <text x="140" y="105" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle" direction="rtl">التواصل</text>
    <text x="140" y="130" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">إيصال الأفكار بفعالية</text>
  </g>

  <!-- Row 2, Column 2 (Item 5: Middle) -->
  <g transform="translate(500, 440)">
    <rect width="280" height="160" rx="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g clip-path="url(#cardClip)">
      <rect width="280" height="6" fill="#4A7AAE"/>
    </g>
    <!-- Icon: Square -->
    <g transform="translate(140, 55)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#4A7AAE" opacity="0.1"/>
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#4A7AAE"/>
    </g>
    <!-- Text -->
    <text x="140" y="105" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle" direction="rtl">التكنولوجيا</text>
    <text x="140" y="130" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">استخدام الأدوات الرقمية</text>
  </g>

  <!-- Row 2, Column 1 (Item 6: Left) -->
  <g transform="translate(160, 440)">
    <rect width="280" height="160" rx="15" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g clip-path="url(#cardClip)">
      <rect width="280" height="6" fill="#2D588C"/>
    </g>
    <!-- Icon: Pentagon -->
    <g transform="translate(140, 55)">
      <polygon points="0,-24 23,-7 14,20 -14,20 -23,-7" fill="#2D588C" opacity="0.1"/>
      <polygon points="0,-12 11.5,-3.5 7,10 -7,10 -11.5,-3.5" fill="#2D588C"/>
    </g>
    <!-- Text -->
    <text x="140" y="105" font-family="'Tajawal', sans-serif" font-size="16" font-weight="700" fill="#1A202C" text-anchor="middle" direction="rtl">القيادة</text>
    <text x="140" y="130" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">توجيه وإلهام الآخرين</text>
  </g>

</svg>