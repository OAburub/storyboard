<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="12" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="card-clip">
      <rect width="340" height="300" rx="16" />
    </clipPath>

    <g id="up-arrow">
      <circle cx="0" cy="0" r="20" fill="#10B981" fill-opacity="0.12" />
      <path d="M 0 -7.5 L -7.5 0 h 4.5 v 7.5 h 6 v -7.5 h 4.5 Z" fill="#10B981" />
    </g>

    <g id="down-arrow">
      <circle cx="0" cy="0" r="20" fill="#EF4444" fill-opacity="0.12" />
      <path d="M 0 7.5 L -7.5 0 h 4.5 v -7.5 h 6 v 7.5 h 4.5 Z" fill="#EF4444" />
    </g>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <circle cx="1150" cy="-50" r="400" fill="#2D588C" opacity="0.02" />
  <circle cx="100" cy="800" r="350" fill="#F5A623" opacity="0.02" />

  <text x="640" y="110" font-family="Tajawal, sans-serif" font-size="48" font-weight="700" fill="#2D588C" text-anchor="middle" direction="rtl">مؤشرات الأداء الرئيسية</text>
  <rect x="590" y="140" width="100" height="6" rx="3" fill="#2D588C" opacity="0.15" />
  <rect x="620" y="140" width="40" height="6" rx="3" fill="#F5A623" />

  <g transform="translate(65, 230)">
    <rect width="340" height="300" rx="16" fill="#ffffff" filter="url(#card-shadow)" />
    <g clip-path="url(#card-clip)">
      <rect width="340" height="8" fill="#2D588C" />
    </g>

    <text x="170" y="115" font-family="Tajawal, sans-serif" font-size="60" font-weight="700" fill="#2D588C" text-anchor="middle" direction="rtl">92%</text>

    <use href="#up-arrow" x="170" y="165" />

    <text x="170" y="225" font-family="Tajawal, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle" direction="rtl">نسبة الرضا</text>
    <text x="170" y="255" font-family="Tajawal, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">ارتفاع مقارنة بالعام السابق</text>
  </g>

  <g transform="translate(470, 230)">
    <rect width="340" height="300" rx="16" fill="#ffffff" filter="url(#card-shadow)" />
    <g clip-path="url(#card-clip)">
      <rect width="340" height="8" fill="#F5A623" />
    </g>

    <text x="170" y="115" font-family="Tajawal, sans-serif" font-size="60" font-weight="700" fill="#F5A623" text-anchor="middle" direction="rtl">4.7</text>

    <use href="#up-arrow" x="170" y="165" />

    <text x="170" y="225" font-family="Tajawal, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle" direction="rtl">متوسط التقييم</text>
  </g>

  <g transform="translate(875, 230)">
    <rect width="340" height="300" rx="16" fill="#ffffff" filter="url(#card-shadow)" />
    <g clip-path="url(#card-clip)">
      <rect width="340" height="8" fill="#009688" />
    </g>

    <text x="170" y="115" font-family="Tajawal, sans-serif" font-size="52" font-weight="700" fill="#009688" text-anchor="middle" direction="rtl">15 دقيقة</text>

    <use href="#down-arrow" x="170" y="165" />

    <text x="170" y="225" font-family="Tajawal, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle" direction="rtl">وقت الإكمال</text>
    <text x="170" y="255" font-family="Tajawal, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" direction="rtl">تحسن ملحوظ</text>
  </g>
</svg>