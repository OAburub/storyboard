<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" direction="rtl" xml:lang="ar">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F8F9FA" />
            <stop offset="100%" stop-color="#EEF2F7" />
        </linearGradient>

        <!-- Card Gradient (Primary to Secondary) -->
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2D588C" />
            <stop offset="100%" stop-color="#4A90D9" />
        </linearGradient>

        <!-- Card Drop Shadow -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
            <feOffset dx="0" dy="12" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.15" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Circle Drop Shadow -->
        <filter id="circleShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
            <feOffset dx="0" dy="6" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.1" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 Z" fill="#F5A623" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1280" height="720" fill="url(#bgGrad)" />

    <!-- Decorative Background Elements -->
    <circle cx="100" cy="100" r="300" fill="#4A90D9" opacity="0.03" />
    <circle cx="1200" cy="650" r="400" fill="#2D588C" opacity="0.03" />

    <!-- Title Section -->
    <text x="640" y="110" font-family="Tajawal, sans-serif" font-size="28" font-weight="900" fill="#2D588C" text-anchor="middle">مراحل التصميم التعليمي</text>
    <rect x="590" y="130" width="100" height="4" rx="2" fill="#F5A623" />

    <!-- Connecting Arrows (Drawn behind circles) -->
    <!-- Arrow 1 (Step 1 to Step 2) -->
    <path d="M 1045 280 Q 940 210 835 280" fill="none" stroke="#F5A623" stroke-width="3" marker-end="url(#arrow)" />
    
    <!-- Arrow 2 (Step 2 to Step 3) -->
    <path d="M 745 280 Q 640 210 535 280" fill="none" stroke="#F5A623" stroke-width="3" marker-end="url(#arrow)" />
    
    <!-- Arrow 3 (Step 3 to Step 4) -->
    <path d="M 445 280 Q 340 210 235 280" fill="none" stroke="#F5A623" stroke-width="3" marker-end="url(#arrow)" />

    <!-- ========================================== -->
    <!-- STEP 1: التحليل -->
    <!-- ========================================== -->
    <g transform="translate(980, 320)">
        <!-- Card -->
        <rect width="220" height="200" rx="15" fill="url(#cardGrad)" filter="url(#shadow)" />
        
        <!-- Geometric Icon: Analysis / Chart -->
        <rect x="95" y="35" width="6" height="20" rx="2" fill="#FFFFFF" opacity="0.9"/>
        <rect x="105" y="25" width="6" height="30" rx="2" fill="#FFFFFF" opacity="0.9"/>
        <rect x="115" y="40" width="6" height="15" rx="2" fill="#FFFFFF" opacity="0.9"/>
        
        <!-- Text -->
        <text x="110" y="105" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">التحليل</text>
        <text x="110" y="140" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">تحديد الاحتياجات</text>
        <text x="110" y="165" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">والأهداف</text>
    </g>
    <!-- Step 1 Circle -->
    <g transform="translate(1090, 280)">
        <circle r="35" fill="#FFFFFF" filter="url(#circleShadow)" stroke="#F5A623" stroke-width="4"/>
        <text x="0" y="10" font-family="Tajawal, sans-serif" font-size="28" font-weight="bold" fill="#2D588C" text-anchor="middle">1</text>
    </g>

    <!-- ========================================== -->
    <!-- STEP 2: التصميم -->
    <!-- ========================================== -->
    <g transform="translate(680, 320)">
        <!-- Card -->
        <rect width="220" height="200" rx="15" fill="url(#cardGrad)" filter="url(#shadow)" />
        
        <!-- Geometric Icon: Design / Shapes -->
        <rect x="95" y="30" width="20" height="20" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
        <circle cx="115" cy="45" r="10" fill="none" stroke="#F5A623" stroke-width="3"/>
        
        <!-- Text -->
        <text x="110" y="105" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">التصميم</text>
        <text x="110" y="140" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">تصميم المحتوى</text>
        <text x="110" y="165" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">والأنشطة</text>
    </g>
    <!-- Step 2 Circle -->
    <g transform="translate(790, 280)">
        <circle r="35" fill="#FFFFFF" filter="url(#circleShadow)" stroke="#F5A623" stroke-width="4"/>
        <text x="0" y="10" font-family="Tajawal, sans-serif" font-size="28" font-weight="bold" fill="#2D588C" text-anchor="middle">2</text>
    </g>

    <!-- ========================================== -->
    <!-- STEP 3: التطوير -->
    <!-- ========================================== -->
    <g transform="translate(380, 320)">
        <!-- Card -->
        <rect width="220" height="200" rx="15" fill="url(#cardGrad)" filter="url(#shadow)" />
        
        <!-- Geometric Icon: Development / Code Brackets -->
        <path d="M 100 35 L 90 45 L 100 55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <path d="M 120 35 L 130 45 L 120 55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
        <line x1="115" y1="30" x2="105" y2="60" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
        
        <!-- Text -->
        <text x="110" y="105" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">التطوير</text>
        <text x="110" y="140" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">إنتاج المواد</text>
        <text x="110" y="165" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">التعليمية</text>
    </g>
    <!-- Step 3 Circle -->
    <g transform="translate(490, 280)">
        <circle r="35" fill="#FFFFFF" filter="url(#circleShadow)" stroke="#F5A623" stroke-width="4"/>
        <text x="0" y="10" font-family="Tajawal, sans-serif" font-size="28" font-weight="bold" fill="#2D588C" text-anchor="middle">3</text>
    </g>

    <!-- ========================================== -->
    <!-- STEP 4: التقييم -->
    <!-- ========================================== -->
    <g transform="translate(80, 320)">
        <!-- Card -->
        <rect width="220" height="200" rx="15" fill="url(#cardGrad)" filter="url(#shadow)" />
        
        <!-- Geometric Icon: Evaluation / Target -->
        <circle cx="110" cy="45" r="14" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
        <circle cx="110" cy="45" r="5" fill="#F5A623"/>
        
        <!-- Text -->
        <text x="110" y="105" font-family="Tajawal, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">التقييم</text>
        <text x="110" y="140" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">قياس فعالية</text>
        <text x="110" y="165" font-family="Tajawal, sans-serif" font-size="16" fill="#EEF2F7" text-anchor="middle">التعلم</text>
    </g>
    <!-- Step 4 Circle -->
    <g transform="translate(190, 280)">
        <circle r="35" fill="#FFFFFF" filter="url(#circleShadow)" stroke="#F5A623" stroke-width="4"/>
        <text x="0" y="10" font-family="Tajawal, sans-serif" font-size="28" font-weight="bold" fill="#2D588C" text-anchor="middle">4</text>
    </g>

</svg>