<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" dir="rtl" xml:lang="ar">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>

    <!-- Timeline Line Gradient (Right to Left) -->
    <linearGradient id="lineGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2D588C"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#2D588C"/>
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A202C" flood-opacity="0.04" />
    </filter>

    <!-- Active Marker Glow -->
    <filter id="active-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F5A623" flood-opacity="0.3" />
    </filter>

    <!-- Dot Pattern for subtle background texture -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#2D588C" opacity="0.04" />
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap');
      text {
        font-family: 'Tajawal', sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <rect width="1280" height="720" fill="url(#dots)" />

  <!-- Main Title -->
  <text x="640" y="90" font-size="44" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">مراحل تطور الذكاء الاصطناعي</text>

  <!-- ==================== TIMELINE LINES ==================== -->
  <!-- Pending/Future Dashed Line (Extending left of active marker) -->
  <line x1="235" y1="400" x2="100" y2="400" stroke="#C3D4E8" stroke-width="6" stroke-dasharray="8 8" stroke-linecap="round" />
  
  <!-- Completed Solid Line (From right to left active marker) -->
  <line x1="1180" y1="400" x2="235" y2="400" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Direction Arrows on the Timeline -->
  <path d="M 918 393 L 910 400 L 918 407" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 648 393 L 640 400 L 648 407" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 378 393 L 370 400 L 378 407" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ==================== VERTICAL CONNECTORS ==================== -->
  <line x1="1045" y1="300" x2="1045" y2="400" stroke="#4A90D9" stroke-width="3" opacity="0.7" stroke-dasharray="6 4" />
  <line x1="775" y1="400" x2="775" y2="500" stroke="#4A90D9" stroke-width="3" opacity="0.7" stroke-dasharray="6 4" />
  <line x1="505" y1="300" x2="505" y2="400" stroke="#4A90D9" stroke-width="3" opacity="0.7" stroke-dasharray="6 4" />
  <line x1="235" y1="400" x2="235" y2="500" stroke="#F5A623" stroke-width="3" opacity="0.7" stroke-dasharray="6 4" />


  <!-- ==================== MILESTONE 1 (1956) - Rightmost / Top ==================== -->
  <g id="milestone-1">
    <!-- Card Background -->
    <rect x="915" y="140" width="260" height="160" rx="16" fill="#ffffff" filter="url(#card-shadow)" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Year Pill -->
    <rect x="995" y="165" width="100" height="36" rx="18" fill="#F0F5FA" />
    <text x="1080" y="190" font-size="22" font-weight="800" fill="#2D588C" text-anchor="end">1956</text>
    
    <!-- Icon: Dartmouth Diamond -->
    <g transform="translate(1003, 171)">
      <path d="M12 2 L22 12 L12 22 L2 12 Z" fill="none" stroke="#2D588C" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Texts -->
    <text x="1045" y="240" font-size="22" font-weight="700" fill="#1A202C" text-anchor="middle">مؤتمر دارتموث</text>
    <text x="1045" y="275" font-size="16" font-weight="500" fill="#718096" text-anchor="middle">ولادة المصطلح</text>

    <!-- Timeline Marker -->
    <circle cx="1045" cy="400" r="12" fill="#2D588C" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- ==================== MILESTONE 2 (1997) - Bottom ==================== -->
  <g id="milestone-2">
    <!-- Card Background -->
    <rect x="645" y="500" width="260" height="160" rx="16" fill="#ffffff" filter="url(#card-shadow)" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Year Pill -->
    <rect x="725" y="525" width="100" height="36" rx="18" fill="#F0F5FA" />
    <text x="810" y="550" font-size="22" font-weight="800" fill="#2D588C" text-anchor="end">1997</text>
    
    <!-- Icon: Chess Grid -->
    <g transform="translate(733, 531)">
      <rect x="3" y="3" width="7" height="7" rx="1.5" fill="#2D588C"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5" fill="#2D588C"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="#2D588C" stroke-width="2"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="#2D588C" stroke-width="2"/>
    </g>

    <!-- Texts -->
    <text x="775" y="600" font-size="22" font-weight="700" fill="#1A202C" text-anchor="middle">ديب بلو</text>
    <text x="775" y="635" font-size="16" font-weight="500" fill="#718096" text-anchor="middle">هزيمة بطل الشطرنج</text>

    <!-- Timeline Marker -->
    <circle cx="775" cy="400" r="12" fill="#2D588C" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- ==================== MILESTONE 3 (2012) - Top ==================== -->
  <g id="milestone-3">
    <!-- Card Background -->
    <rect x="375" y="140" width="260" height="160" rx="16" fill="#ffffff" filter="url(#card-shadow)" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Year Pill -->
    <rect x="455" y="165" width="100" height="36" rx="18" fill="#F0F5FA" />
    <text x="540" y="190" font-size="22" font-weight="800" fill="#2D588C" text-anchor="end">2012</text>
    
    <!-- Icon: Neural Network -->
    <g transform="translate(463, 171)">
      <circle cx="12" cy="5" r="3" fill="#2D588C"/>
      <circle cx="5" cy="18" r="3" fill="#2D588C"/>
      <circle cx="19" cy="18" r="3" fill="#2D588C"/>
      <line x1="10" y1="7" x2="6" y2="15" stroke="#2D588C" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="7" x2="18" y2="15" stroke="#2D588C" stroke-width="2" stroke-linecap="round"/>
      <line x1="8" y1="18" x2="16" y2="18" stroke="#2D588C" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Texts -->
    <text x="505" y="240" font-size="22" font-weight="700" fill="#1A202C" text-anchor="middle">التعلم العميق</text>
    <text x="505" y="275" font-size="16" font-weight="500" fill="#718096" text-anchor="middle">ثورة الشبكات العصبية</text>

    <!-- Timeline Marker -->
    <circle cx="505" cy="400" r="12" fill="#2D588C" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- ==================== MILESTONE 4 (2024) - Leftmost / Bottom / ACTIVE ==================== -->
  <g id="milestone-4">
    <!-- Card Background -->
    <rect x="105" y="500" width="260" height="160" rx="16" fill="#ffffff" filter="url(#card-shadow)" stroke="#F5A623" stroke-width="2" />
    
    <!-- Year Pill -->
    <rect x="185" y="525" width="100" height="36" rx="18" fill="#FFF4E5" />
    <text x="270" y="550" font-size="22" font-weight="800" fill="#D97706" text-anchor="end">2024</text>
    
    <!-- Icon: Generative Star -->
    <g transform="translate(193, 531)">
      <path d="M12 1 Q12 12 23 12 Q12 12 12 23 Q12 12 1 12 Q12 12 12 1 Z" fill="#F5A623"/>
    </g>

    <!-- Texts -->
    <text x="235" y="600" font-size="22" font-weight="700" fill="#1A202C" text-anchor="middle">النماذج الكبيرة</text>
    <text x="235" y="635" font-size="16" font-weight="500" fill="#718096" text-anchor="middle">عصر الذكاء التوليدي</text>

    <!-- Timeline Marker (Active) -->
    <circle cx="235" cy="400" r="16" fill="#F5A623" stroke="#ffffff" stroke-width="5" filter="url(#active-shadow)" />
    <circle cx="235" cy="400" r="5" fill="#ffffff" />
  </g>

</svg>